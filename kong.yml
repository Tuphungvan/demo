_format_version: "3.0"

services:
  # Job Service (port 8081)
  - name: job-service
    url: http://host.docker.internal:8081
    routes:
      - name: job-route
        paths:
          - /api/jobs
        strip_path: false

  # Worker Service (port 8082)
  - name: worker-service
    url: http://host.docker.internal:8082
    routes:
      - name: worker-route
        paths:
          - /api/worker
        strip_path: false

  # Monitor Service (port 8083)
  - name: monitor-service
    url: http://host.docker.internal:8083
    routes:
      - name: monitor-route
        paths:
          - /api/monitor
        strip_path: false
